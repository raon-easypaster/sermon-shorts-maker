# 윈도우 설치 파일 만들기: v로 시작하는 태그를 올리면(예: v0.3.0) 윈도우 빌드 서버에서
# 하네스 시험 → next build → 설치 파일을 만들고, 같은 이름의 릴리스에 올린다.
# 시험이 하나라도 실패하면 설치 파일을 만들지 않는다 (npm run dist 가 verify 를 먼저 돈다).
name: 윈도우 설치 파일
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never
      - name: 체크섬
        shell: pwsh
        run: |
          $f = Get-ChildItem dist/SermonShortsMaker-Setup-*.exe | Select-Object -First 1
          if (-not $f) { throw "설치 파일이 없습니다" }
          # 맥·리눅스의 shasum -c 로도 바로 확인되게 줄바꿈은 LF 로
          $line = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name + "`n"
          [IO.File]::WriteAllText("$PWD/dist/SHA256SUMS.txt", $line, [Text.Encoding]::ASCII)
          Get-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/SermonShortsMaker-Setup-*.exe
            dist/SHA256SUMS.txt
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "설교·찬양 쇼츠 메이커 $tag" --notes-file .github/release-notes.md --latest
          gh release upload "$tag" dist/SermonShortsMaker-Setup-*.exe dist/SHA256SUMS.txt --clobber
